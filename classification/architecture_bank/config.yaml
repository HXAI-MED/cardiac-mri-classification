# Experiment settings. Null training values inherit the original CineMA YAML defaults.
logging:
  dir: ???
data:
  acdc_raw: null
  mnms2_raw: null
  acdc_processed: null
  mnms2_processed: null
model:
  foundation_checkpoint: null
  cnn2d_tasks:
  - mnms2_lax_4c
  cnn3d_tasks:
  - mnms2_sax
  models_2d:
  - mobilenet_v3_small
  - efficientnet_b0
  - resnet18
  models_3d:
  - resnet10_3d
  - densenet121_3d
  - efficientnet_b0_3d
  formulations_2d:
  - stacked
  - shared
  formulations_3d:
  - stacked
  - shared
  initializations_2d:
  - randinit
  - imagenet
train:
  n_epochs: null
  n_warmup_epochs: null
  eval_interval: null
  patience: null
  batch_size: null
  batch_size_per_device_2d: null
  batch_size_per_device_3d: 1
  n_workers: null
  lr: null
run:
  stages:
  - preprocess
  - calibrate
  tasks:
  - all
  seeds:
  - 0
  - 1
  - 2
  calibration_tolerance: 0.03
  allow_calibration_failure: false
  force_preprocess: false
  resume: true
  smoke: false
  amp: true
  official_modes:
  - cinema_finetune
  - cinema_randinit
  - resnet50_randinit
hydra:
  job:
    chdir: false
  run:
    dir: ${logging.dir}/hydra/${now:%Y-%m-%d_%H-%M-%S}
